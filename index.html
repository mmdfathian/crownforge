<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<meta name="description" content="قلعه‌سازان: تاج خاکستر - بازی استراتژی بر اساس Canvas">
<title>قلعه‌سازان: تاج خاکستر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="top">
    <div class="bar">
      <span class="bar-title">⚔️ تاج خاکستر</span>
      <span class="small">روز <span id="day">1</span></span>
    </div>
    <div class="bar">
      <span class="res gold">
        <span class="res-icon">🪙</span>
        <span class="res-value" id="gold">1200</span>
      </span>
      <span class="res food">
        <span class="res-icon">🌾</span>
        <span class="res-value" id="food">800</span>
      </span>
      <span class="res gem">
        <span class="res-icon">💎</span>
        <span class="res-value" id="gems">35</span>
      </span>
    </div>
  </div>

  <div id="msg"></div>

  <div id="panel">
    <h3 id="ptitle">ساختمان</h3>
    <div id="pbody"></div>
    <div class="panel-actions">
      <button id="upgrade" class="btn primary">ارتقا</button>
      <button id="close" class="btn">بستن</button>
    </div>
  </div>

  <div class="bottom">
    <button id="build" class="btn"><span class="btn-icon">🏗️</span> ساخت</button>
    <button id="army" class="btn"><span class="btn-icon">⚔️</span> ارتش</button>
    <button id="raid" class="btn"><span class="btn-icon">🔥</span> یورش</button>
    <button id="quests" class="btn"><span class="btn-icon">📜</span> مأموریت</button>
    <button id="save" class="btn"><span class="btn-icon">💾</span> ذخیره</button>
  </div>

  <div id="side">
    <b>⚔️ فرماندهی</b>
    <div>🏆 افتخار: <span class="gold" id="honor">0</span></div>
    <div>👥 جمعیت: <span id="pop">12</span>/<span id="popCap">50</span></div>
    <div>🛡️ قدرت دفاع: <span id="power">35</span></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
